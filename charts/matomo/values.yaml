# Values for the matomo chart. Pass an extra -f overlay for other environments.

app:
  name: matomo
  namespace: matomo
  environment: stage
  replicas: 1
  image: matomo
  tag: "5.7.1-apache"
  port: 80
  pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  healthcheck:
    # Responds before the web UI is provisioned, unlike /.
    path: /matomo.php
    liveness:
      # First boot runs database migrations; too short a delay loops restarts.
      initialDelaySeconds: 120
      periodSeconds: 60
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 30
  env:
    MATOMO_DATABASE_ADAPTER: "mysql"
    MATOMO_DATABASE_TABLES_PREFIX: "matomo_"
    PHP_MEMORY_LIMIT: "512M"
    # Errors to the container log rather than into rendered pages.
    PHP_LOG_ERRORS: "On"
    PHP_ERROR_LOG: "/dev/stderr"
    PHP_DISPLAY_ERRORS: "On"
    PHP_ERROR_REPORTING: "E_ALL"

service:
  type: NodePort
  port: 80
  # NOTE: ignored — service.yaml never renders it, so the port is random.
  nodePort: 30080

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}

# Each entry becomes its own PVC, declared in templates/deployment.yaml.
storage:
  storageClassName: local-path
  config:
    size: 1Gi
  plugins:
    size: 5Gi
  misc:
    size: 2Gi
  tmp:
    size: 2Gi

# Local-only database. Credentials are static throwaway values, not secrets.
mariadb:
  enabled: true
  storageSize: 10Gi
  storageClassName: local-path
  rootPassword: "root"
  database: "matomo"
  user: "matomo"
  password: "matomo"
  adminUser: "nba_admin"
  adminPassword: "admin_password"

# Report aggregates are built on a schedule; without this, reports stay empty.
archiving:
  enabled: true
  schedule: "5 * * * *"
  # In-cluster service name, so archiving does not depend on DNS or the ingress.
  url: "http://matomo:80"
  concurrent: 4
  concurrentArchivers: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
