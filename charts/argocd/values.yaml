# Overrides for the upstream chart in Chart.yaml. Local cluster: no SSO, no ingress.
argo-cd:

  configs:
    cm:
      # Must match how you reach the UI, or post-login redirects break.
      url: https://localhost:8080
    params:
      # TLS on. Setting true serves plain HTTP, so https:// is reset, not redirected.
      server.insecure: false

  # Metrics Services are off by default; the annotation lets prometheus find them.
  controller:
    metrics:
      enabled: true
      service:
        annotations:
          prometheus.io/scrape: "true"
  server:
    metrics:
      enabled: true
      service:
        annotations:
          prometheus.io/scrape: "true"
  repoServer:
    metrics:
      enabled: true
      service:
        annotations:
          prometheus.io/scrape: "true"

  # Local installs use the built-in admin account.
  dex:
    enabled: false

  notifications:
    enabled: false

  applicationSet:
    enabled: true
    metrics:
      enabled: true
      service:
        annotations:
          prometheus.io/scrape: "true"
