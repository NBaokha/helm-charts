apiVersion: v2
name: argocd
description: Argo CD, wrapping the upstream argo-helm chart.
type: application

# Version of this wrapper, not of Argo CD.
version: 1.0.0
appVersion: v3.5.1

# Argo CD cannot bootstrap itself; install with helm first. See README.md.
dependencies:
  - name: argo-cd
    version: 10.4.0
    repository: https://argoproj.github.io/argo-helm
