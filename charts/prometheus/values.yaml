# Overrides for the upstream chart in Chart.yaml.
prometheus:

  # Host-level metrics are not meaningful on single-node Docker Desktop / WSL2.
  prometheus-node-exporter:
    enabled: false

  scrapeConfigs:
    aikido:
      enabled: true
      job_name: aikido
      scrape_interval: 60s
      static_configs:
        - targets:
            # Runs on the host, outside the cluster.
            - host.docker.internal:8000
