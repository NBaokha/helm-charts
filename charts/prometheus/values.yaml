# Overrides for the upstream prometheus chart pinned in Chart.yaml. Only values
# that differ from upstream defaults belong here.
#   helm show values prometheus-community/prometheus --version 28.9.0
prometheus:

  # Host-level metrics are not meaningful on single-node Docker Desktop / WSL2.
  prometheus-node-exporter:
    enabled: false

  scrapeConfigs:
    aikido:
      enabled: true
      job_name: aikido
      scrape_interval: 60s
      static_configs:
        - targets:
            # Runs on the host, outside the cluster.
            - host.docker.internal:8000

  # Appended verbatim to prometheus.yml. Targets report down until charts/argocd
  # is installed.
  extraScrapeConfigs: |
    - job_name: argocd
      static_configs:
        - targets:
          - argocd-metrics.argocd.svc.cluster.local:8082
          - argocd-server-metrics.argocd.svc.cluster.local:8083
          - argocd-repo-server.argocd.svc.cluster.local:8084
