apiVersion: v2
name: prometheus
description: Prometheus monitoring stack, wrapping the upstream community chart.
type: application

# Version of this wrapper, not of Prometheus.
version: 1.0.0
appVersion: v3.9.1

# Upstream as-is; customisation lives in values.yaml under `prometheus:`.
dependencies:
  - name: prometheus
    version: 28.9.0
    repository: https://prometheus-community.github.io/helm-charts
