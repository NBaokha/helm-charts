apiVersion: v2
name: prometheus
description: Prometheus monitoring stack, wrapping the upstream community chart.
type: application

# Version of this wrapper, not of Prometheus.
version: 1.0.0
appVersion: v3.9.1

# Upstream is used as-is; all customisation lives in values.yaml under
# the `prometheus:` key. See the repo README to upgrade.
dependencies:
  - name: prometheus
    version: 28.9.0
    repository: https://prometheus-community.github.io/helm-charts
