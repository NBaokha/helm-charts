{{- /*
Scrape annotations rather than a ServiceMonitor, so this works with
charts/prometheus, which has no Prometheus Operator CRDs.
*/}}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-metrics
  namespace: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: metrics
  annotations:
    # Prometheus annotations for automatic discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "15692"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: prometheus
      port: 15692
      targetPort: 15692
      protocol: TCP
  selector:
    app.kubernetes.io/name: rabbitmq
