{{- /*
RabbitmqCluster custom resource plus its PodDisruptionBudget. Requires the
RabbitMQ Cluster Operator, which builds the StatefulSet from this.

Hardcoded rather than templated; this chart has no values.yaml.
*/}}
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
    environment: stage

spec:
  # Single node in stage. Raising this above 1 also requires revisiting the
  # PodDisruptionBudget and anti-affinity rules at the bottom of this file.
  replicas: 1

  image: rabbitmq:4.1.3-management

  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi

  persistence:
    storage: 5Gi
    storageClassName: testing

  rabbitmq:
    # NOTE: this block is literal rabbitmq.conf content, not YAML. The comments
    # inside it are part of the rendered config file.
    additionalConfig: |
      # Load definitions on startup
      management.load_definitions = /etc/rabbitmq/definitions.json

      # Staging environment configuration
      # Note: cluster_formation.* and cluster_partition_handling are set by operator defaults

      # Memory and disk limits (overriding defaults for staging)
      vm_memory_high_watermark.relative = 0.6
      disk_free_limit.absolute = 1GB

      # Consumer timeout (15 minutes)
      consumer_timeout = 900000

      # Prometheus metrics (detailed)
      prometheus.return_per_object_metrics = true

      # High availability (overriding operator default)
      queue_master_locator = min-masters

      # Clustering (prod-like tuning)
      cluster_keepalive_interval = 10000

    additionalPlugins:
      - rabbitmq_shovel
      - rabbitmq_shovel_management
      - rabbitmq_federation
      - rabbitmq_federation_management

  service:
    type: ClusterIP

  # Mounts the definitions ConfigMap into the path referenced by
  # management.load_definitions above. The checksum annotation forces a rollout
  # whenever the definitions change.
  override:
    statefulSet:
      spec:
        template:
          metadata:
            annotations:
              checksum/config: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
          spec:
            containers:
              - name: rabbitmq
                volumeMounts:
                  - name: definitions
                    mountPath: /etc/rabbitmq/definitions.json
                    subPath: definitions.json
            volumes:
            - name: definitions
              configMap:
                name: rabbitmq-definitions

  # Keeps brokers on separate nodes. This is `required`, so with replicas > 1 on
  # a single-node cluster the extra pods stay Pending.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - rabbitmq
          topologyKey: kubernetes.io/hostname

---
{{- /*
With replicas: 1, minAvailable: 1 leaves no disruption budget at all, so a node
drain will block until this PDB is removed or the cluster is scaled up.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
---
