# Overrides for the upstream grafana chart pinned in Chart.yaml. Only values
# that differ from upstream defaults belong here.
#   helm show values grafana-community/grafana --version 9.4.5
#
# Targets a local cluster: no ingress, no SSO, reached via
#   kubectl -n <ns> port-forward svc/grafana 3000:80
# The previous stage config (ingress, Keycloak OAuth, saoad.dk hosts) is in git
# history if it is ever needed again.
grafana:

  # Pinned: chart 9.4.5 defaults the tag to its own appVersion (12.1.1), which
  # would silently downgrade us from the 12.4.0 this repo has been running.
  image:
    tag: "12.4.0"

  persistence:
    enabled: true

  # Renders a grafana-test Pod and ConfigMap we never run.
  testFramework:
    enabled: false

  # Placeholders, not secrets — override with --set for anything real.
  adminUser: admin
  adminPassword: strongpassword

  plugins:
    - yesoreyeram-infinity-datasource
    - alexanderzobnin-zabbix-app
    - grafana-github-datasource

  sidecar:
    plugins:
      enabled: true

  grafana.ini:
    log:
      level: info

    server:
      # Must match how the UI is actually reached, or redirects and asset URLs
      # break. Change this if you port-forward to a different local port.
      root_url: http://localhost:3000

    # Git Sync: Grafana reads dashboard JSON from ./dashboards in this repo
    # directly, so `dashboards: {}` is correct — Helm must not render them.
    feature_toggles:
      provisioning: true
      kubernetesDashboards: true
