# Overrides for the upstream chart in Chart.yaml. Local cluster: no ingress, no SSO.
grafana:

  # Chart 9.4.5 would otherwise default the tag to 12.1.1 and downgrade us.
  image:
    tag: "12.4.0"

  persistence:
    enabled: true

  # chown -R fails on Docker Desktop / WSL2 hostpath volumes and crashloops the pod.
  initChownData:
    enabled: false

  # Renders a grafana-test Pod we never run.
  testFramework:
    enabled: false

  # Placeholders, not secrets.
  adminUser: admin
  adminPassword: strongpassword

  plugins:
    - yesoreyeram-infinity-datasource
    - alexanderzobnin-zabbix-app
    - grafana-github-datasource

  sidecar:
    plugins:
      enabled: true

  grafana.ini:
    log:
      level: info

    server:
      # Must match the port you forward, or redirects and asset URLs break.
      root_url: http://localhost:3000

    # Git Sync reads ./dashboards from this repo directly; Helm must not render them.
    feature_toggles:
      provisioning: true
      kubernetesDashboards: true
